name: Branch Deleted
on: delete

env:
  TAG_NAME: ${{ github.event.ref }}

jobs:
  delete:
    strategy:
      fail-fast: false
      matrix:
        component:
          - name: qubership-docker-integration-tests
          - name: qubership-docker-integration-tests-debian
          - name: qubership-docker-integration-tests-hardening
          - name: qubership-docker-integration-tests-hardening-transfer
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{secrets.GITHUB_TOKEN}}
      # Same tag as push.yml publishes: the branch name with characters invalid in a tag replaced by '-'.
      - name: Prepare Tag
        run: |
          branch="${TAG_NAME#refs/heads/}"
          echo "TAG_NAME=${branch//[^a-zA-Z0-9._-]/-}" >> "$GITHUB_ENV"
      - name: Get package IDs for delete
        id: get-ids-for-delete
        uses: Netcracker/get-package-ids@v0.0.1
        with:
          component-name: ${{ matrix.component.name }}
          component-tag: ${{ env.TAG_NAME }}
          access-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.component.name }}
          package-type: 'container'
          package-version-ids: ${{ steps.get-ids-for-delete.outputs.ids-for-delete }}
        if: ${{ steps.get-ids-for-delete.outputs.ids-for-delete != '' }}
