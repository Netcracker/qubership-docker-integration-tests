---
name: Run Tests

# No path filter: "CI Gate" is a required status check, so it must report on every pull request.
on:
  pull_request:
    branches:
      - '**'

permissions:
  contents: read
  actions: write
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.14']  # match the Python version of the image

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt', 'test-requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r test-requirements.txt

      - name: Install the package in development mode
        run: |
          cd library
          pip install -e .

      - name: Check installed dependencies for conflicts
        run: python -m pip check

      - name: Run tests with pytest and generate coverage
        run: |
          python -m pytest library/tests/ -v --cov=integration_library_builtIn --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to GitHub
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          path: coverage.xml

  ci-gate:
    name: CI Gate
    needs: [test]
    # Runs even when a dependency fails, so the check resolves instead of being skipped.
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require successful test jobs
        if: needs.test.result != 'success'
        run: exit 1
