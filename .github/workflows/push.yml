---
name: Build Artifacts

on:
  release:
    types: [created]
  # Branches are built once, by their pull request run, which also publishes the branch images.
  # Pushes build and publish main only; releases publish the release tag.
  push:
    branches:
      - main
    # Keep in sync with the skip list in .github/ci/detect-image-changes.sh, which pull requests use.
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/auto-labeler-config.yaml'
      - '.github/release-drafter-config.yml'
      - '.github/super-linter.env'
      - '.github/linters/**'
      - 'docs/**'
      - 'CODE-OF-CONDUCT.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'README.md'
      - 'SECURITY.md'
  # No path filter on pull requests: "Build Gate" is a required status check, so it must report on
  # every pull request. The changes job skips the builds when only documentation changed.
  pull_request:
    branches:
      - '**'

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  # On main/release, we don't want any jobs cancelled so the sha is used to name the group
  # On PR branches, we cancel the job if new commits are pushed
  # More info: https://stackoverflow.com/a/68422069/253468
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.sha) || format('ci-main-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
      publish: ${{ steps.publish.outputs.publish }}
      branch-tag: ${{ steps.publish.outputs.branch-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changes that affect the images
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/ci/detect-image-changes.sh "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      # Publish <branch> images for branches of this repository. Fork pull requests have no write
      # access to the registry, and dependency update branches are tested only.
      - name: Decide whether to publish branch images
        id: publish
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$HEAD_REPO" == "$REPOSITORY" && "$HEAD_REF" != renovate/* && "$HEAD_REF" != dependabot/* ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          echo "branch-tag=${HEAD_REF//[^a-zA-Z0-9._-]/-}" >> "$GITHUB_OUTPUT"

  # Images that have no dependency on other images in this repository.
  # Run in parallel via the matrix.
  build-base:
    needs: changes
    if: >-
      always() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.run == 'true')
    strategy:
      fail-fast: false
      matrix:
        component:
          - name: qubership-docker-integration-tests
            file: Dockerfile
            context: .
          - name: qubership-docker-integration-tests-debian
            file: debian-build/Dockerfile
            context: .
          - name: qubership-docker-integration-tests-hardening-transfer
            file: container-hardening/docker-transfer/Dockerfile
            context: .
    runs-on: ubuntu-latest
    name: ${{ matrix.component.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build & push image
        uses: ./.github/actions/build-docker-image
        with:
          component-name: ${{ matrix.component.name }}
          file: ${{ matrix.component.file }}
          context: ${{ matrix.component.context }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          publish: ${{ github.event_name != 'pull_request' || needs.changes.outputs.publish == 'true' }}
          branch-tag: ${{ needs.changes.outputs.branch-tag }}

  # Builds FROM qubership-docker-integration-tests at the same git ref, so it
  # must wait for build-base to publish the base image first.
  # Runs only when build-base published: otherwise there is nothing to build FROM in the registry.
  # The hardening image is tested by integration-tests.yaml, which builds both images locally.
  build-hardening:
    needs: [changes, build-base]
    if: >-
      always() && needs.build-base.result == 'success' &&
      (github.event_name != 'pull_request' || needs.changes.outputs.publish == 'true')
    runs-on: ubuntu-latest
    name: qubership-docker-integration-tests-hardening
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build & push image
        uses: ./.github/actions/build-docker-image
        with:
          component-name: qubership-docker-integration-tests-hardening
          file: container-hardening/docker/Dockerfile
          context: container-hardening
          use-base-tag: 'true'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          publish: 'true'
          branch-tag: ${{ needs.changes.outputs.branch-tag }}

  # Builds each image for linux/amd64 and checks the contract that downstream images rely on.
  image-test:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        component:
          - name: qubership-docker-integration-tests
            file: Dockerfile
          - name: qubership-docker-integration-tests-debian
            file: debian-build/Dockerfile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build image
        env:
          DOCKERFILE: ${{ matrix.component.file }}
        run: docker build --tag image-under-test:ci --file "$DOCKERFILE" .
      - name: Run smoke test
        run: .github/ci/image-smoke/run-smoke-test.sh image-under-test:ci

  build-gate:
    # Only the pull_request run reports the required check. A push run of the same commit must not
    # satisfy or override it.
    name: ${{ github.event_name == 'pull_request' && 'Build Gate' || 'Build Gate (not required)' }}
    needs: [changes, build-base, build-hardening, image-test]
    # Runs even when a dependency fails, so the check resolves instead of being skipped.
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require successful builds when applicable
        if: >-
          (github.event_name == 'pull_request' &&
          (needs.changes.result != 'success' ||
          (needs.changes.outputs.run != 'false' &&
          (needs.build-base.result != 'success' || needs.image-test.result != 'success')))) ||
          (github.event_name != 'pull_request' && needs.build-base.result != 'success') ||
          needs.build-hardening.result == 'failure'
        run: exit 1
